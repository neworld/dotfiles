# Session/program description (set per-window via @tab_desc; Claude fills it
# automatically, other programs via the `desc` shell helper). Bold orange chip
# so it never visually merges with the path or the window tabs.
set -g status-right '#{?@tab_desc,#[fg=#88C0D0]#[bold]✦ #{@tab_desc}#[default]  ,}#[fg=#A3BE8C]#{pane_current_path}#[default] '

# Keep window numbers contiguous so new windows always open at the end
set -g renumber-windows on

set-window-option -g window-status-current-style reverse